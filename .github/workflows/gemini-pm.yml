name: PM Gemini - Refinamento de Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero da issue a refinar (teste manual)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pm-gemini-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  refinar-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Coletar issue, backlog e labels do repositorio
        run: |
          gh issue view "$ISSUE_NUMBER" --json number,title,body > issue.json
          gh issue list --state all --limit 200 --json number,title,state > backlog.json
          gh label list --limit 100 --json name,description > labels.json

      - name: Refinar com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python3 .github/scripts/refinar_issue.py

      - name: Atualizar a issue
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --title "$(cat novo_titulo.txt)" \
            --body-file nova_descricao.md

          if [ -s labels.txt ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "$(cat labels.txt)"
          fi

      - name: Avisar na issue se o refinamento falhou
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "O refinamento automatico falhou. Log da execucao: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
